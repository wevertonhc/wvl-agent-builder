<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WVL Agent Builder</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#09090f;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
  input,textarea,select{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#fff;padding:10px 14px;border-radius:8px;width:100%;font-family:inherit;font-size:14px;outline:none;transition:border-color .15s}
  input:focus,textarea:focus{border-color:rgba(245,158,11,0.5)}
  input::placeholder,textarea::placeholder{color:rgba(255,255,255,0.25)}
  textarea{resize:vertical;min-height:80px}
  button{cursor:pointer;font-family:inherit;transition:all .15s}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fade{animation:fadeIn .25s ease}
  .spin{animation:spin .8s linear infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const A = "#F59E0B";

const STEPS = [
  {id:"negocio",label:"Negócio",icon:"🏢"},
  {id:"produtos",label:"Produtos",icon:"📦"},
  {id:"publico",label:"Público",icon:"👥"},
  {id:"tom",label:"Tom de Voz",icon:"🗣️"},
  {id:"objetivos",label:"Objetivos",icon:"🎯"},
];

const REDES = ["Instagram","TikTok","WhatsApp","Facebook","YouTube","LinkedIn"];

const emptyForm = {
  nome:"",segmento:"",cidade:"",redes:[],
  p1:"",p2:"",p3:"",p4:"",p5:"",carro_chefe:"",diferencial:"",
  perfil:"",dores:"",canais:"",
  personalidade:"",como_fala:"",proibicoes:"",exemplo:"",
  obj_principal:"",obj_secundario:"",meta_30:""
};

function Tag({label,sel,onClick}){
  return <button onClick={onClick} style={{
    padding:"6px 14px",borderRadius:20,fontSize:12,border:sel?"1.5px solid "+A:"1px solid rgba(255,255,255,0.15)",
    background:sel?"rgba(245,158,11,0.15)":"transparent",color:sel?A:"rgba(255,255,255,0.5)"
  }}>{label}</button>;
}

function Btn({children,onClick,primary,disabled,full,danger}){
  const bg = danger?"rgba(239,68,68,0.15)":primary?(disabled?"rgba(245,158,11,0.2)":A):"transparent";
  const col = danger?"#EF4444":primary?(disabled?"rgba(245,158,11,0.4)":"#000"):"rgba(255,255,255,0.5)";
  const bor = danger?"1px solid rgba(239,68,68,0.3)":primary?(disabled?"1px solid rgba(245,158,11,0.2)":"none"):"1px solid rgba(255,255,255,0.12)";
  return <button onClick={!disabled?onClick:undefined} style={{
    padding:"11px 22px",borderRadius:8,fontSize:14,fontWeight:primary?600:400,
    background:bg,color:col,border:bor,width:full?"100%":"auto",
    cursor:disabled?"not-allowed":"pointer",opacity:disabled?0.7:1
  }}>{children}</button>;
}

function Field({label,hint,children}){
  return <div style={{marginBottom:20}}>
    <label style={{display:"block",fontSize:12,fontWeight:600,color:"rgba(255,255,255,0.5)",marginBottom:6,letterSpacing:"0.06em",textTransform:"uppercase"}}>{label}</label>
    {hint&&<p style={{fontSize:12,color:"rgba(255,255,255,0.3)",marginBottom:8}}>{hint}</p>}
    {children}
  </div>;
}

function Card({children,style={}}){
  return <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,...style}}>{children}</div>;
}

function ApiSetup({onSave}){
  const [key,setKey]=useState("");
  const [show,setShow]=useState(false);
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <Card style={{maxWidth:480,width:"100%",padding:"40px 32px",textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:16}}>🔑</div>
      <h1 style={{fontSize:22,fontWeight:700,marginBottom:8}}>Configurar API Key</h1>
      <p style={{fontSize:14,color:"rgba(255,255,255,0.4)",marginBottom:28,lineHeight:1.6}}>
        Para gerar agentes com IA, você precisa de uma API Key da Anthropic.<br/>
        <a href="https://console.anthropic.com" target="_blank" style={{color:A}}>Obter chave gratuita →</a>
      </p>
      <div style={{position:"relative",marginBottom:16}}>
        <input type={show?"text":"password"} value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-api03-..." style={{paddingRight:44}}/>
        <button onClick={()=>setShow(s=>!s)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"rgba(255,255,255,0.4)",fontSize:14,cursor:"pointer"}}>
          {show?"🙈":"👁️"}
        </button>
      </div>
      <Btn primary full onClick={()=>{if(key.startsWith("sk-")){localStorage.setItem("wvl_key",key);onSave(key);}else alert("Chave inválida. Deve começar com sk-")}}>
        Salvar e continuar →
      </Btn>
      <p style={{fontSize:11,color:"rgba(255,255,255,0.2)",marginTop:16}}>Sua chave fica salva apenas neste navegador</p>
    </Card>
  </div>;
}

function Dashboard({clients,onNew,onOpen,onDeleteClient,apiKey,onResetKey}){
  return <div style={{maxWidth:900,margin:"0 auto",padding:"32px 20px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:40,flexWrap:"wrap",gap:12}}>
      <div>
        <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:20,padding:"4px 14px",marginBottom:10}}>
          <span style={{fontSize:11,color:A,fontWeight:700,letterSpacing:"0.1em"}}>WVL PRODUTORA</span>
        </div>
        <h1 style={{fontSize:26,fontWeight:700,letterSpacing:"-0.02em"}}>Agent Builder</h1>
        <p style={{fontSize:14,color:"rgba(255,255,255,0.4)",marginTop:4"}}>{clients.length} cliente{clients.length!==1?"s":""} cadastrado{clients.length!==1?"s":""}</p>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <button onClick={onResetKey} style={{background:"none",border:"1px solid rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.3)",borderRadius:8,padding:"8px 14px",fontSize:12,cursor:"pointer"}}>⚙️ API Key</button>
        <Btn primary onClick={onNew}>+ Novo cliente</Btn>
      </div>
    </div>

    {clients.length===0?
      <Card style={{padding:"60px 32px",textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:16}}>🤖</div>
        <h2 style={{fontSize:18,fontWeight:600,marginBottom:8}}>Nenhum cliente ainda</h2>
        <p style={{fontSize:14,color:"rgba(255,255,255,0.4)",marginBottom:24}}>Crie o primeiro agente e veja a mágica acontecer</p>
        <Btn primary onClick={onNew}>Criar primeiro agente</Btn>
      </Card>
    :
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:14}}>
        {clients.map(c=><Card key={c.id} style={{padding:"20px",cursor:"pointer",transition:"border-color .15s"}}
          onMouseEnter={e=>e.currentTarget.style.borderColor="rgba(245,158,11,0.3)"}
          onMouseLeave={e=>e.currentTarget.style.borderColor="rgba(255,255,255,0.08)"}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
            <div style={{width:40,height:40,borderRadius:10,background:"rgba(245,158,11,0.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>
              {c.data.segmento?.toLowerCase().includes("food")||c.data.segmento?.toLowerCase().includes("ali")||c.data.segmento?.toLowerCase().includes("empad")?"🍽️":
               c.data.segmento?.toLowerCase().includes("bel")||c.data.segmento?.toLowerCase().includes("est")?"💅":
               c.data.segmento?.toLowerCase().includes("pet")?"🐾":"🏢"}
            </div>
            <button onClick={e=>{e.stopPropagation();if(confirm("Remover "+c.data.nome+"?"))onDeleteClient(c.id)}} style={{background:"none",border:"none",color:"rgba(255,255,255,0.2)",fontSize:16,cursor:"pointer",padding:4}}>✕</button>
          </div>
          <h3 style={{fontSize:15,fontWeight:600,marginBottom:4}} onClick={()=>onOpen(c)}>{c.data.nome||"Sem nome"}</h3>
          <p style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:12}}>{c.data.segmento||"Segmento não definido"}</p>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:11,color:"rgba(255,255,255,0.25)"}}>{new Date(c.createdAt).toLocaleDateString("pt-BR")}</span>
            <button onClick={()=>onOpen(c)} style={{background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.2)",color:A,borderRadius:6,padding:"4px 12px",fontSize:12,cursor:"pointer"}}>
              Ver agente →
            </button>
          </div>
        </Card>)}
      </div>
    }
    <p style={{textAlign:"center",marginTop:40,fontSize:11,color:"rgba(255,255,255,0.15)",letterSpacing:"0.06em"}}>WVL PRODUTORA — AGENT BUILDER v1.0</p>
  </div>;
}

function NewClientForm({onSave,onBack,apiKey}){
  const [step,setStep]=useState(0);
  const [form,setForm]=useState({...emptyForm});
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState("");
  const [copied,setCopied]=useState(false);
  const s=(k,v)=>setForm(f=>({...f,[k]:v}));
  const tog=(r)=>s("redes",form.redes.includes(r)?form.redes.filter(x=>x!==r):[...form.redes,r]);

  const canNext=()=>{
    if(step===0)return form.nome&&form.segmento&&form.cidade;
    if(step===1)return form.p1&&form.carro_chefe;
    if(step===2)return form.perfil&&form.dores;
    if(step===3)return form.personalidade&&form.como_fala;
    if(step===4)return form.obj_principal&&form.meta_30;
    return true;
  };

  const generate=async()=>{
    setLoading(true);
    setResult("");
    const prods=[form.p1,form.p2,form.p3,form.p4,form.p5].filter(Boolean).map((p,i)=>`${i+1}. ${p}`).join("\n");
    const prompt=`Você é especialista em criação de agentes de IA para marketing digital.

Crie um SYSTEM PROMPT completo, profissional e EXCLUSIVO para o seguinte negócio. NÃO use templates genéricos — escreva tudo de forma específica, como se você conhecesse esse negócio há anos.

DADOS:
Negócio: ${form.nome} | Segmento: ${form.segmento} | Cidade: ${form.cidade} | Redes: ${form.redes.join(", ")||"Instagram"}
Produtos: ${prods}
Carro-chefe: ${form.carro_chefe} | Diferencial: ${form.diferencial||"não informado"}
Público: ${form.perfil} | Dores: ${form.dores} | Canais: ${form.canais||"redes sociais"}
Tom: ${form.personalidade} | Como fala: ${form.como_fala} | Proibições: ${form.proibicoes||"nenhuma específica"}
Exemplo de frase: "${form.exemplo||"não fornecido"}"
Objetivo principal: ${form.obj_principal} | Secundário: ${form.obj_secundario||"construir autoridade"} | Meta 30 dias: ${form.meta_30}

REGRAS:
- Escreva o agente com PERSONALIDADE REAL, não robótica
- Inclua exemplos concretos de frases no tom da marca
- Defina pilares de conteúdo específicos para este nicho e objetivos
- CTAs específicos para o negócio (não genéricos)
- O agente deve soar como alguém que vive naquele negócio
- Pronto para colar direto no Claude Projects
- Português brasileiro
- Seja específico, rico em detalhes e exclusivo`;

    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-opus-4-5",max_tokens:2000,messages:[{role:"user",content:prompt}]})
      });
      const d=await r.json();
      if(d.error)throw new Error(d.error.message);
      const text=d.content?.map(b=>b.text||"").join("")||"Erro ao gerar.";
      setResult(text);
      onSave({id:Date.now(),createdAt:new Date().toISOString(),data:form,agent:text});
    }catch(e){
      setResult("❌ Erro: "+e.message+"\n\nVerifique sua API Key nas configurações.");
    }
    setLoading(false);
  };

  const copy=()=>{navigator.clipboard.writeText(result);setCopied(true);setTimeout(()=>setCopied(false),2000)};
  const exportTxt=()=>{
    const blob=new Blob([`AGENTE IA — ${form.nome}\nGerado em: ${new Date().toLocaleDateString("pt-BR")}\n\n${result}`],{type:"text/plain"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`agente_${form.nome.replace(/\s+/g,"_")}.txt`;a.click();
  };

  return <div style={{maxWidth:680,margin:"0 auto",padding:"32px 20px"}} className="fade">
    <button onClick={onBack} style={{background:"none",border:"none",color:"rgba(255,255,255,0.4)",fontSize:14,cursor:"pointer",marginBottom:24,display:"flex",alignItems:"center",gap:6}}>
      ← Voltar
    </button>

    {/* Stepper */}
    <div style={{display:"flex",alignItems:"center",marginBottom:36,overflowX:"auto",paddingBottom:4}}>
      {STEPS.map((st,i)=><React.Fragment key={st.id}>
        <div onClick={()=>i<step&&setStep(i)} style={{
          display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"6px 10px",borderRadius:8,
          background:step===i?"rgba(245,158,11,0.1)":"transparent",
          border:step===i?"1px solid rgba(245,158,11,0.25)":"1px solid transparent",
          cursor:i<step?"pointer":"default",minWidth:60,flexShrink:0
        }}>
          <span style={{fontSize:18}}>{st.icon}</span>
          <span style={{fontSize:10,fontWeight:600,letterSpacing:"0.04em",color:step===i?A:i<step?"rgba(255,255,255,0.45)":"rgba(255,255,255,0.2)"}}>{st.label}</span>
        </div>
        {i<STEPS.length-1&&<div style={{flex:1,height:1,background:i<step?"rgba(245,158,11,0.35)":"rgba(255,255,255,0.08)",minWidth:12}}/>}
      </React.Fragment>)}
    </div>

    {step<5&&<Card style={{padding:"28px 24px"}} className="fade">
      {step===0&&<>
        <h2 style={{fontSize:18,fontWeight:600,marginBottom:24}}>🏢 Sobre o negócio</h2>
        <Field label="Nome do negócio *"><input value={form.nome} onChange={e=>s("nome",e.target.value)} placeholder="Ex: Empadão da Carol"/></Field>
        <Field label="Segmento / nicho *" hint="Quanto mais específico, melhor o agente"><input value={form.segmento} onChange={e=>s("segmento",e.target.value)} placeholder="Ex: Alimentação — empadões artesanais delivery"/></Field>
        <Field label="Cidade / estado *"><input value={form.cidade} onChange={e=>s("cidade",e.target.value)} placeholder="Ex: Campo Grande, MS"/></Field>
        <Field label="Redes sociais ativas">
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{REDES.map(r=><Tag key={r} label={r} sel={form.redes.includes(r)} onClick={()=>tog(r)}/>)}</div>
        </Field>
      </>}
      {step===1&&<>
        <h2 style={{fontSize:18,fontWeight:600,marginBottom:24}}>📦 Produtos e serviços</h2>
        {[["p1","Produto / serviço 1 *"],["p2","Produto / serviço 2"],["p3","Produto / serviço 3"],["p4","Produto / serviço 4"],["p5","Produto / serviço 5"]].map(([k,l])=>
          <Field key={k} label={l}><input value={form[k]} onChange={e=>s(k,e.target.value)} placeholder="Ex: Empadão Frango com Requeijão (G) — R$45"/></Field>
        )}
        <Field label="Carro-chefe *" hint="O produto que mais vende ou deve ser priorizado"><input value={form.carro_chefe} onChange={e=>s("carro_chefe",e.target.value)} placeholder="Ex: Empadão Frango com Requeijão tamanho G"/></Field>
        <Field label="Diferencial competitivo"><textarea value={form.diferencial} onChange={e=>s("diferencial",e.target.value)} placeholder="Ex: Massa folhada artesanal, feita no dia, sem conservantes"/></Field>
      </>}
      {step===2&&<>
        <h2 style={{fontSize:18,fontWeight:600,marginBottom:24}}>👥 Público-alvo</h2>
        <Field label="Perfil principal *" hint="Idade, gênero, situação de vida, localização"><textarea value={form.perfil} onChange={e=>s("perfil",e.target.value)} placeholder="Ex: Mulheres de 28 a 50 anos, mães, trabalhadoras, moram em Campo Grande, classe B/C"/></Field>
        <Field label="Dores e desejos *"><textarea value={form.dores} onChange={e=>s("dores",e.target.value)} placeholder="Ex: Não têm tempo para cozinhar, querem comida gostosa e sem culpa, buscam praticidade"/></Field>
        <Field label="Como descobre a marca"><input value={form.canais} onChange={e=>s("canais",e.target.value)} placeholder="Ex: Indicação de amigas, Instagram, grupos de WhatsApp do bairro"/></Field>
      </>}
      {step===3&&<>
        <h2 style={{fontSize:18,fontWeight:600,marginBottom:24}}>🗣️ Tom de voz</h2>
        <Field label="Personalidade da marca *" hint="3 adjetivos que definem a marca"><input value={form.personalidade} onChange={e=>s("personalidade",e.target.value)} placeholder="Ex: Acolhedora, divertida e confiante"/></Field>
        <Field label="Como a marca fala *"><textarea value={form.como_fala} onChange={e=>s("como_fala",e.target.value)} placeholder="Ex: Tuteia, usa emojis com moderação, linguagem simples e próxima, nunca formal demais"/></Field>
        <Field label="O que a marca nunca faz"><input value={form.proibicoes} onChange={e=>s("proibicoes",e.target.value)} placeholder="Ex: Nunca fala mal de concorrentes, nunca promete o que não pode cumprir"/></Field>
        <Field label="Exemplo de frase no tom certo"><input value={form.exemplo} onChange={e=>s("exemplo",e.target.value)} placeholder='Ex: Fome bateu? A Carol já deixou o empadão prontinho pra você 🥧❤️'/></Field>
      </>}
      {step===4&&<>
        <h2 style={{fontSize:18,fontWeight:600,marginBottom:24}}>🎯 Objetivos e metas</h2>
        <Field label="Objetivo principal *"><input value={form.obj_principal} onChange={e=>s("obj_principal",e.target.value)} placeholder="Ex: Aumentar pedidos via WhatsApp"/></Field>
        <Field label="Objetivo secundário"><input value={form.obj_secundario} onChange={e=>s("obj_secundario",e.target.value)} placeholder="Ex: Crescer seguidores no Instagram e construir autoridade local"/></Field>
        <Field label="Meta em 30 dias *" hint="Um número concreto que define sucesso"><input value={form.meta_30} onChange={e=>s("meta_30",e.target.value)} placeholder="Ex: 80 pedidos no mês / 500 novos seguidores / 3 posts por semana"/></Field>
      </>}

      <div style={{display:"flex",justifyContent:"space-between",marginTop:28,gap:10}}>
        {step>0?<Btn onClick={()=>setStep(s=>s-1)}>← Voltar</Btn>:<div/>}
        {step<4
          ?<Btn primary disabled={!canNext()} onClick={()=>canNext()&&setStep(s=>s+1)}>Continuar →</Btn>
          :<button disabled={!canNext()} onClick={()=>{if(canNext()){setStep(5);generate()}}} style={{
            padding:"11px 28px",borderRadius:8,fontSize:14,fontWeight:700,
            background:canNext()?"linear-gradient(135deg,#F59E0B,#EF4444)":"rgba(245,158,11,0.2)",
            border:"none",color:canNext()?"#000":"rgba(245,158,11,0.4)",cursor:canNext()?"pointer":"not-allowed"
          }}>✨ Gerar Agente</button>
        }
      </div>
    </Card>}

    {step===5&&<Card style={{padding:"28px 24px"}} className="fade">
      <h2 style={{fontSize:18,fontWeight:600,marginBottom:8}}>✨ Agente gerado para {form.nome}</h2>
      {loading?<div style={{textAlign:"center",padding:"48px 0"}}>
        <div className="spin" style={{display:"inline-block",width:36,height:36,border:"3px solid rgba(245,158,11,0.2)",borderTop:"3px solid "+A,borderRadius:"50%"}}/>
        <p style={{color:"rgba(255,255,255,0.4)",fontSize:14,marginTop:16}}>Analisando o negócio e criando o agente exclusivo...</p>
      </div>:result&&<>
        <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
          <button onClick={copy} style={{
            padding:"6px 16px",borderRadius:8,fontSize:12,fontWeight:500,
            background:copied?"rgba(16,185,129,0.15)":"rgba(245,158,11,0.12)",
            border:copied?"1px solid rgba(16,185,129,0.4)":"1px solid rgba(245,158,11,0.3)",
            color:copied?"#10B981":A,cursor:"pointer"
          }}>{copied?"✓ Copiado!":"📋 Copiar"}</button>
          <button onClick={exportTxt} style={{padding:"6px 16px",borderRadius:8,fontSize:12,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.5)",cursor:"pointer"}}>
            ⬇️ Exportar .txt
          </button>
        </div>
        <div style={{background:"rgba(0,0,0,0.3)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,padding:"18px 16px",maxHeight:440,overflowY:"auto",fontSize:13,lineHeight:1.8,color:"rgba(255,255,255,0.8)",whiteSpace:"pre-wrap",fontFamily:"'Courier New',monospace"}}>
          {result}
        </div>
        <div style={{marginTop:16,padding:"12px 14px",background:"rgba(245,158,11,0.06)",border:"1px solid rgba(245,158,11,0.15)",borderRadius:8}}>
          <p style={{fontSize:12,color:"rgba(245,158,11,0.8)",margin:0}}>
            ✅ Agente salvo no histórico. Cole o conteúdo acima nas <strong>Instruções do Projeto</strong> no Claude.ai
          </p>
        </div>
      </>}
    </Card>}
  </div>;
}

function ClientDetail({client,onBack,onDelete}){
  const [copied,setCopied]=useState(false);
  const copy=()=>{navigator.clipboard.writeText(client.agent);setCopied(true);setTimeout(()=>setCopied(false),2000)};
  const exportTxt=()=>{
    const blob=new Blob([`AGENTE IA — ${client.data.nome}\nGerado em: ${new Date(client.createdAt).toLocaleDateString("pt-BR")}\n\n${client.agent}`],{type:"text/plain"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`agente_${client.data.nome.replace(/\s+/g,"_")}.txt`;a.click();
  };
  return <div style={{maxWidth:680,margin:"0 auto",padding:"32px 20px"}} className="fade">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:28}}>
      <button onClick={onBack} style={{background:"none",border:"none",color:"rgba(255,255,255,0.4)",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>← Voltar</button>
      <button onClick={()=>{if(confirm("Remover "+client.data.nome+"?"))onDelete(client.id)}} style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.2)",color:"#EF4444",borderRadius:8,padding:"6px 14px",fontSize:12,cursor:"pointer"}}>🗑 Remover</button>
    </div>
    <Card style={{padding:"24px"}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:14,marginBottom:20}}>
        <div style={{width:44,height:44,borderRadius:10,background:"rgba(245,158,11,0.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>
          {client.data.segmento?.toLowerCase().includes("ali")||client.data.segmento?.toLowerCase().includes("empad")?"🍽️":"🏢"}
        </div>
        <div>
          <h1 style={{fontSize:20,fontWeight:700}}>{client.data.nome}</h1>
          <p style={{fontSize:13,color:"rgba(255,255,255,0.4)"}}>{client.data.segmento} · {client.data.cidade}</p>
          <p style={{fontSize:11,color:"rgba(255,255,255,0.25)",marginTop:2}}>Criado em {new Date(client.createdAt).toLocaleDateString("pt-BR")}</p>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
        {[["Carro-chefe",client.data.carro_chefe],["Redes",client.data.redes.join(", ")||"—"],["Objetivo",client.data.obj_principal],["Meta 30 dias",client.data.meta_30]].map(([k,v])=>
          <div key={k} style={{background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"10px 12px"}}>
            <p style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.05em"}}>{k}</p>
            <p style={{fontSize:13,color:"rgba(255,255,255,0.8)"}}>{v||"—"}</p>
          </div>
        )}
      </div>
      <div style={{borderTop:"1px solid rgba(255,255,255,0.06)",paddingTop:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <h3 style={{fontSize:14,fontWeight:600}}>System Prompt gerado</h3>
          <div style={{display:"flex",gap:8}}>
            <button onClick={copy} style={{padding:"5px 14px",borderRadius:8,fontSize:12,background:copied?"rgba(16,185,129,0.15)":"rgba(245,158,11,0.1)",border:copied?"1px solid rgba(16,185,129,0.3)":"1px solid rgba(245,158,11,0.2)",color:copied?"#10B981":A,cursor:"pointer"}}>{copied?"✓ Copiado":"📋 Copiar"}</button>
            <button onClick={exportTxt} style={{padding:"5px 14px",borderRadius:8,fontSize:12,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.4)",cursor:"pointer"}}>⬇️ .txt</button>
          </div>
        </div>
        <div style={{background:"rgba(0,0,0,0.3)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,padding:"16px",maxHeight:480,overflowY:"auto",fontSize:13,lineHeight:1.8,color:"rgba(255,255,255,0.8)",whiteSpace:"pre-wrap",fontFamily:"'Courier New',monospace"}}>
          {client.agent}
        </div>
      </div>
    </Card>
  </div>;
}

function App(){
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("wvl_key")||"");
  const [view,setView]=useState("dashboard");
  const [clients,setClients]=useState(()=>{try{return JSON.parse(localStorage.getItem("wvl_clients")||"[]")}catch{return[]}});
  const [selected,setSelected]=useState(null);

  const saveClients=(arr)=>{setClients(arr);localStorage.setItem("wvl_clients",JSON.stringify(arr))};
  const addClient=(c)=>saveClients([c,...clients]);
  const deleteClient=(id)=>{saveClients(clients.filter(c=>c.id!==id));if(selected?.id===id){setSelected(null);setView("dashboard")}};

  if(!apiKey) return <ApiSetup onSave={k=>{setApiKey(k);setView("dashboard")}}/>;

  if(view==="new") return <NewClientForm apiKey={apiKey} onBack={()=>setView("dashboard")} onSave={c=>{addClient(c);setSelected(c);setView("detail")}}/>;
  if(view==="detail"&&selected) return <ClientDetail client={selected} onBack={()=>setView("dashboard")} onDelete={id=>{deleteClient(id);setView("dashboard")}}/>;

  return <Dashboard
    clients={clients}
    onNew={()=>setView("new")}
    onOpen={c=>{setSelected(c);setView("detail")}}
    onDeleteClient={deleteClient}
    apiKey={apiKey}
    onResetKey={()=>{localStorage.removeItem("wvl_key");setApiKey("")}}
  />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
